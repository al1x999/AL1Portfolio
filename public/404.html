<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Found | AL1</title>
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(23, 23, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      border: 2px solid #06b6d4;
      background: #000;
      padding: 4px;
      margin: 0 auto 1.5rem;
      display: block;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }
    .code {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: #06b6d4;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #a3a3a3;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      background: #06b6d4;
      color: #000;
      font-weight: 700;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      background: #22d3ee;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.6875rem;
      color: #737373;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="AL1" class="logo">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The requested URL does not exist or has been relocated within the AL1 creative network.</p>
    <a href="/" class="btn">Return to Portfolio</a>
    <div class="footer">&copy; 2026 AL1. All rights reserved.</div>
  </div>
</body>
</html>
